<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>GAME MUSIC PLAYER</h1>
        <div id="status" class="muted">Loading playlist…</div>
      </div>
      <div class="top-actions">
        <button id="shuffleBtn" title="Shuffle">🔀</button>
        <button id="repeatBtn" title="Repeat">↻</button>
        <button id="settingsBtn" title="Settings">⚙</button>
      </div>
    </header>

    <section class="player">
      <div class="now-playing">
        <div class="cover" id="cover">♪</div>
        <div class="track-info">
          <div id="title">No track selected</div>
          <div id="meta" class="muted">—</div>
        </div>
      </div>

      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button id="prevBtn" class="transport">⏮</button>
        <button id="playBtn" class="play">▶</button>
        <button id="nextBtn" class="transport">⏭</button>
        <div class="volume">
          <span>🔊</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <section class="content">
      <aside class="sidebar">
        <input id="search" type="search" placeholder="Search tracks…">
        <div class="filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="chosen">★ Chosen</button>
          <button class="filter" data-filter="blocked">🚫 Blocked</button>
        </div>
        <div class="import-export">
          <button id="exportBtn">Export</button>
          <label class="file-button">Import
            <input id="importFile" type="file" accept="application/json">
          </label>
        </div>
      </aside>

      <section class="playlist-panel">
        <div class="playlist-header">
          <span id="trackCount">0 tracks</span>
          <button id="clearBlockedBtn">Clear blocked</button>
        </div>
        <div id="playlist" class="playlist"></div>
      </section>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog">
      <h2>Settings</h2>
      <label>Autoplay next
        <input id="autoplayNext" type="checkbox" checked>
      </label>
      <label>Start shuffled
        <input id="startShuffled" type="checkbox">
      </label>
      <button>Close</button>
    </form>
  </dialog>

  <script src="player.js"></script>
</body>
</html>
